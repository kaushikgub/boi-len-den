server {
    listen 80;
    server_name _;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # Proxy all /api requests to the gateway.
    # No trailing slash on proxy_pass → the full /api/... path is forwarded as-is.
    location /api/ {
        proxy_pass         http://api-gateway:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Let Set-Cookie (the HttpOnly refresh-token cookie) pass through untouched.
        proxy_pass_header  Set-Cookie;
    }

    # Serve the Vite SPA. All unknown paths fall back to index.html so that
    # React Router can handle client-side navigation.
    location / {
        root       /usr/share/nginx/html;
        index      index.html;
        try_files  $uri $uri/ /index.html;
    }
}
