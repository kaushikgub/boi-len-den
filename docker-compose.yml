# Slice 1 topology — infrastructure only for now. App containers (api-gateway,
# auth-service, rental-service, inventory-service, web-frontend) are added to this
# file as each is built in subsequent steps.
#
# One Postgres container PER service (separate creds) to mirror prod isolation and
# make cross-service DB access physically impossible. Kafka runs in KRaft mode (no
# ZooKeeper). Schema Registry holds the JSON Schemas for our events.

name: boi-len-den

services:
  # ---- Postgres: one per DB-owning service ------------------------------------
  postgres-auth:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
      POSTGRES_DB: auth
    ports:
      - '5433:5432'
    volumes:
      - pg-auth-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U auth -d auth']
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-rental:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rental
      POSTGRES_PASSWORD: rental
      POSTGRES_DB: rental
    ports:
      - '5434:5432'
    volumes:
      - pg-rental-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rental -d rental']
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-inventory:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
      POSTGRES_DB: inventory
    ports:
      - '5435:5432'
    volumes:
      - pg-inventory-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U inventory -d inventory']
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-catalog:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog
      POSTGRES_DB: catalog
    ports:
      - '5436:5432'
    volumes:
      - pg-catalog-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U catalog -d catalog']
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-notification:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: notification
      POSTGRES_PASSWORD: notification
      POSTGRES_DB: notification
    ports:
      - '5437:5432'
    volumes:
      - pg-notification-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U notification -d notification']
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-payment:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: payment
      POSTGRES_DB: payment
    ports:
      - '5438:5432'
    volumes:
      - pg-payment-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U payment -d payment']
      interval: 5s
      timeout: 5s
      retries: 10

  # ---- Redis: revocation denylist, cache, reservation gate, rate limiting -----
  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # ---- Kafka (KRaft single node) ----------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.7.1
    ports:
      - '9092:9092' # host-facing listener (tests, local tooling)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Fixed cluster id so the KRaft metadata log survives restarts.
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ['CMD', 'kafka-topics', '--bootstrap-server', 'localhost:9092', '--list']
      interval: 10s
      timeout: 10s
      retries: 12

  # ---- Schema Registry (JSON Schema subjects for our events) ------------------
  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.1
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - '8081:8081'
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'PLAINTEXT://kafka:29092'
      SCHEMA_REGISTRY_LISTENERS: 'http://0.0.0.0:8081'
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: 'backward'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8081/subjects']
      interval: 10s
      timeout: 5s
      retries: 12

  # ---- Application services ---------------------------------------------------

  keys-init:
    image: alpine:3
    volumes:
      - jwt-keys-data:/keys
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        apk add --no-cache openssl > /dev/null &&
        if [ ! -f /keys/jwt-private.pem ]; then
          openssl genrsa -out /keys/jwt-private.pem 2048 &&
          openssl rsa -in /keys/jwt-private.pem -pubout -out /keys/jwt-public.pem &&
          echo "JWT RSA keys generated"
        else
          echo "JWT RSA keys already present"
        fi
    restart: 'no'

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: auth-service
    environment:
      PORT: 3001
      SERVICE_NAME: auth-service
      NODE_ENV: development
      AUTH_DATABASE_URL: postgres://auth:auth@postgres-auth:5432/auth
      REDIS_URL: redis://redis:6379
      JWT_PRIVATE_KEY_PATH: /keys/jwt-private.pem
      JWT_PUBLIC_KEY_PATH: /keys/jwt-public.pem
      ACCESS_TOKEN_TTL: 900
      REFRESH_TOKEN_TTL: 1209600
      ADMIN_EMAIL: admin@boi-len-den.local
      ADMIN_PASSWORD: admin12345
    volumes:
      - jwt-keys-data:/keys
    ports:
      - '3001:3001'
    depends_on:
      postgres-auth:
        condition: service_healthy
      redis:
        condition: service_healthy
      keys-init:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3001/health']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  inventory-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: inventory-service
    environment:
      PORT: 3003
      SERVICE_NAME: inventory-service
      NODE_ENV: development
      INVENTORY_DATABASE_URL: postgres://inventory:inventory@postgres-inventory:5432/inventory
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      AUTH_JWKS_URL: http://auth-service:3001/.well-known/jwks.json
      RESERVATION_TTL_SECONDS: 60
      SWEEP_INTERVAL_SECONDS: 15
    ports:
      - '3003:3003'
    depends_on:
      postgres-inventory:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3003/health']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  rental-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: rental-service
    environment:
      PORT: 3002
      SERVICE_NAME: rental-service
      NODE_ENV: development
      RENTAL_DATABASE_URL: postgres://rental:rental@postgres-rental:5432/rental
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      AUTH_JWKS_URL: http://auth-service:3001/.well-known/jwks.json
      INVENTORY_SERVICE_URL: http://inventory-service:3003
      RENTAL_PERIOD_DAYS: 14
      RENT_LOCK_TTL_SECONDS: 10
    ports:
      - '3002:3002'
    depends_on:
      postgres-rental:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      auth-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3002/health']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  catalog-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: catalog-service
    environment:
      PORT: 3004
      SERVICE_NAME: catalog-service
      NODE_ENV: development
      CATALOG_DATABASE_URL: postgres://catalog:catalog@postgres-catalog:5432/catalog
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      AUTH_JWKS_URL: http://auth-service:3001/.well-known/jwks.json
    ports:
      - '3004:3004'
    depends_on:
      postgres-catalog:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3004/health']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: api-gateway
    environment:
      PORT: 3000
      SERVICE_NAME: api-gateway
      NODE_ENV: development
      REDIS_URL: redis://redis:6379
      AUTH_SERVICE_URL: http://auth-service:3001
      RENTAL_SERVICE_URL: http://rental-service:3002
      INVENTORY_SERVICE_URL: http://inventory-service:3003
      CATALOG_SERVICE_URL: http://catalog-service:3004
      PAYMENT_SERVICE_URL: http://payment-service:3006
      AUTH_JWKS_URL: http://auth-service:3001/.well-known/jwks.json
      RATE_LIMIT_MAX: 100
      RATE_LIMIT_WINDOW_SEC: 60
    ports:
      - '3000:3000'
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      rental-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web-frontend:
    build:
      context: .
      dockerfile: web-frontend/Dockerfile
    ports:
      - '5173:80'
    depends_on:
      api-gateway:
        condition: service_healthy

  # ---- kafka-ui (Provectus) — topics, messages, consumer groups, Schema Registry
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    ports:
      - '8080:8080'
    environment:
      KAFKA_CLUSTERS_0_NAME: boi-len-den
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      DYNAMIC_CONFIG_ENABLED: 'true'

  # ---- Mailpit — SMTP trap for dev email testing (:8025 web UI, :1025 SMTP) ----
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '8025:8025' # web UI
      - '1025:1025' # SMTP
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8025/livez']
      interval: 5s
      timeout: 3s
      retries: 10

  payment-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: payment-service
    environment:
      PORT: 3006
      SERVICE_NAME: payment-service
      NODE_ENV: development
      PAYMENT_DATABASE_URL: postgres://payment:payment@postgres-payment:5432/payment
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      AUTH_JWKS_URL: http://auth-service:3001/.well-known/jwks.json
      CHARGE_AMOUNT_CENTS: 500
    ports:
      - '3006:3006'
    depends_on:
      postgres-payment:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3006/health']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: notification-service
    environment:
      PORT: 3005
      SERVICE_NAME: notification-service
      NODE_ENV: development
      NOTIFICATION_DATABASE_URL: postgres://notification:notification@postgres-notification:5432/notification
      KAFKA_BROKERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: noreply@boi-len-den.local
    ports:
      - '3005:3005'
    depends_on:
      postgres-notification:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3005/health']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ---- RedisInsight — browse keys, TTLs, the reservation gate, denylist --------
  redisinsight:
    image: redis/redisinsight:latest
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - '8001:5540'
    volumes:
      - redisinsight-data:/data

  # ---- One-shot topic creation ------------------------------------------------
  # Creates the rental-lifecycle topics partitioned for per-book ordering, then exits.
  kafka-init:
    image: confluentinc/cp-kafka:7.7.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -e
        echo "Creating topics..."
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic book-created --partitions 6 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic book-rented --partitions 6 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic book-returned --partitions 6 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic book-overdue --partitions 6 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic payment-charged --partitions 6 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic payment-refunded --partitions 6 --replication-factor 1
        echo "Topics present:"
        kafka-topics --bootstrap-server kafka:29092 --list
    restart: 'no'

volumes:
  pg-auth-data:
  pg-rental-data:
  pg-inventory-data:
  pg-catalog-data:
  pg-notification-data:
  pg-payment-data:
  jwt-keys-data:
  redis-data:
  redisinsight-data:
  kafka-data:
